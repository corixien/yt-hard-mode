<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YT Hard Mode</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="card">
      <header class="head">
        <span class="mark">YHM</span>
        <h1>YT Hard Mode</h1>
      </header>

      <section class="group">
        <label class="row">
          <span class="text">
            <strong data-i18n="grayscale"></strong>
            <small data-i18n="grayscaleHint"></small>
          </span>
          <input id="grayscale" class="switch" type="checkbox" role="switch" />
        </label>
      </section>

      <section class="group">
        <label class="row">
          <span class="text">
            <strong data-i18n="timer"></strong>
            <small data-i18n="timerHint"></small>
          </span>
          <input id="timer" class="switch" type="checkbox" role="switch" />
        </label>
        <div id="timerSub" class="sub">
          <div class="row">
            <span data-i18n="size"></span>
            <output id="sizeValue"></output>
          </div>
          <input id="sizePercent" type="range" min="5" max="100" step="1" />
          <label class="row">
            <span data-i18n="backdrop"></span>
            <input id="backdrop" class="switch" type="checkbox" role="switch" />
          </label>
        </div>
      </section>

      <section class="group">
        <label class="row">
          <span class="text">
            <strong data-i18n="limit"></strong>
            <small data-i18n="limitHint"></small>
          </span>
          <input id="limitEnabled" class="switch" type="checkbox" role="switch" />
        </label>
        <div id="limitSub" class="sub">
          <label class="row">
            <span data-i18n="limitMinutes"></span>
            <input id="limitMinutes" class="number" type="number" min="1" max="720" step="1" />
          </label>
          <small id="limitInfo"></small>
        </div>
      </section>

      <section class="stats">
        <div>
          <small data-i18n="today"></small>
          <strong id="today">00:00:00</strong>
        </div>
        <button id="reset" class="ghost" type="button" data-i18n="reset"></button>
      </section>

      <div id="lang" class="lang" role="group" aria-label="Language">
        <span data-i18n="language"></span>
        <div class="seg">
          <button type="button" data-lang="auto">Auto</button>
          <button type="button" data-lang="de">DE</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>

      <footer data-i18n="footer"></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
